name: Release
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+.*'
  workflow_dispatch:
    inputs:
      tag-name:
        description: 'Release version tag used for the production build'
        required: true
        type: string
      publish-release:
        description: 'Publish GitHub Release after building'
        required: true
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    uses: ./.github/workflows/build.yml
    secrets: inherit
    permissions: write-all
    with:
      upload-artifact: true
      tag-name: "${{ inputs.tag-name || github.ref_name }}"
      channel: "${{ github.event_name == 'workflow_dispatch' && 'prod' || github.ref_type == 'tag' && endsWith(github.ref_name, 'dev') && 'dev' || github.ref_type != 'tag' && 'dev' || 'prod' }}"
      # Device validation occurs after artifact download, before publication.
      publish-release: "${{ github.event_name == 'workflow_dispatch' && inputs.publish-release }}"
